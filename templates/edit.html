<!DOCTYPE html>
<html>
<head>
    <title>Sửa Sản Phẩm - SHAVIK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm border-warning mx-auto" style="max-width: 600px;">
            <div class="card-header bg-warning text-dark fw-bold">Sửa Sản Phẩm</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label>Tên áo:</label><input type="text" name="ten_ao" class="form-control" value="{{ sanpham.ten_ao }}" required></div>
                    <div class="mb-3"><label>Giá:</label><input type="number" name="gia" class="form-control" value="{{ sanpham.gia }}" required></div>
                    <div class="mb-3"><label>Size:</label><input type="text" name="size" class="form-control" value="{{ sanpham.size }}" required></div>
                    <div class="mb-3"><label>Link ảnh:</label><input type="url" name="hinh_anh" class="form-control" value="{{ sanpham.hinh_anh }}" required></div>
                    <button type="submit" class="btn btn-primary w-100">Cập nhật</button>
                    <a href="/" class="btn btn-secondary w-100 mt-2">Hủy</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
