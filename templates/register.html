<!DOCTYPE html>
<html>
<head>
    <title>Đăng ký - SHAVIK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background: #f4f6f9; } .card { margin-top: 100px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); } </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body p-4 text-center">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="SHAVIK Logo" style="height: 80px; border-radius: 50%;">
                        <h3 class="mb-4 fw-bold">Đăng Ký SHAVIK</h3>
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}<div class="alert alert-danger">{{ messages[0] }}</div>{% endif %}
                        {% endwith %}
                        <form method="POST">
                            <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Tài khoản" required></div>
                            <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Mật khẩu" required></div>
                            <button type="submit" class="btn btn-success w-100">Đăng ký</button>
                        </form>
                        <div class="mt-3"><a href="/login">Đã có tài khoản? Đăng nhập</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
