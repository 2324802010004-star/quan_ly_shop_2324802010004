<!DOCTYPE html>
<html>
<head>
    <title>Thanh Toán - SHAVIK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="SHAVIK Logo" style="height: 30px; margin-right: 8px; border-radius: 50%;">
                SHAVIK
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-md-7">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold">📍 Thông Tin Giao Hàng</div>
                    <div class="card-body">
                        <form action="/checkout" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Họ và tên người nhận:</label>
                                <input type="text" name="ho_ten" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số điện thoại:</label>
                                <input type="text" name="sdt" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Địa chỉ nhận hàng:</label>
                                <textarea name="dia_chi" class="form-control" rows="2" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Phương thức thanh toán:</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="phuong_thuc_tt" value="Thanh toán khi nhận hàng (COD)" checked>
                                    <label class="form-check-label">Thanh toán khi nhận hàng (COD)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="phuong_thuc_tt" value="Chuyển khoản ngân hàng">
                                    <label class="form-check-label">Chuyển khoản ngân hàng</label>
                                </div>
                            </div>
                            
                            <!-- Khối hiển thị mã QR (Ẩn ban đầu) -->
                            <div id="qr-section" class="mt-3 p-3 bg-white border rounded text-center" style="display: none;">
                                <p class="fw-bold mb-2">Quét mã QR để thanh toán</p>
                                <div id="qrcode" class="d-flex justify-content-center"></div>
                                <p class="text-danger fw-bold mt-2">Số tiền: {{ tong_tien }} đ</p>
                            </div>

                            <button type="submit" class="btn btn-success w-100 btn-lg mt-3">✅ Xác Nhận Đặt Hàng</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">🛒 Đơn Hàng Của Bạn</div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            {% for item in items %}
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <img src="{{ item.hinh_anh }}" width="40" class="rounded me-2">
                                    {{ item.ten_ao }} (x{{ item.so_luong }})
                                </div>
                                <span>{{ item.thanh_tien }} đ</span>
                            </li>
                            {% endfor %}
                        </ul>
                        <hr>
                        <h5 class="text-end">Tổng cộng: <span class="text-danger">{{ tong_tien }} đ</span></h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script tạo QR và xử lý hiển thị -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        const qrData = "{{ qr_content if qr_content else '' }}";
        if (qrData) {
            new QRCode(document.getElementById("qrcode"), {
                text: qrData,
                width: 200,
                height: 200
            });
        }

        document.querySelectorAll('input[name="phuong_thuc_tt"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const qrSection = document.getElementById('qr-section');
                if (this.value === 'Chuyển khoản ngân hàng') {
                    qrSection.style.display = 'block';
                } else {
                    qrSection.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
